name: Render Jspark Short

on:
  push:
    branches:
      - codex/jspark-short
    paths:
      - src/jspark/**
      - .github/workflows/render-jspark-short.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          python -m pip install --upgrade gdown
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Download approved Drive source
        run: |
          mkdir -p work public/jspark out
          gdown "https://drive.google.com/uc?id=1CadJAZDNdXJi7OStrCWN_HndjSDq6JZO" -O work/source.mp4

      - name: Build the 53-second editorial cut
        run: |
          ffmpeg -hide_banner -y -i work/source.mp4 -filter_complex "\
          [0:v]trim=start=94.44:end=106.30,setpts=PTS-STARTPTS[v0];\
          [0:a]atrim=start=94.44:end=106.30,asetpts=PTS-STARTPTS[a0];\
          [0:v]trim=start=121.32:end=137.80,setpts=PTS-STARTPTS[v1];\
          [0:a]atrim=start=121.32:end=137.80,asetpts=PTS-STARTPTS[a1];\
          [0:v]trim=start=150.86:end=163.94,setpts=PTS-STARTPTS[v2];\
          [0:a]atrim=start=150.86:end=163.94,asetpts=PTS-STARTPTS[a2];\
          [0:v]trim=start=180.44:end=192.56,setpts=PTS-STARTPTS[v3];\
          [0:a]atrim=start=180.44:end=192.56,asetpts=PTS-STARTPTS[a3];\
          [v0][a0][v1][a1][v2][a2][v3][a3]concat=n=4:v=1:a=1[v][a];\
          [a]loudnorm=I=-16:TP=-1.5:LRA=11[aout]" \
          -map "[v]" -map "[aout]" -r 30 -c:v libx264 -preset fast -crf 19 -pix_fmt yuv420p \
          -c:a aac -b:a 224k -movflags +faststart public/jspark/source-cut.mp4
          ffprobe -v error -show_entries format=duration,size -of json public/jspark/source-cut.mp4

      - name: Type-check
        run: npx tsc --noEmit

      - name: Render vertical master
        run: |
          npx remotion render src/jspark/index.ts JsparkShort out/Jspark-Academic-Comeback-Short.mp4 \
            --codec=h264 --crf=18 --audio-bitrate=320k --concurrency=2 --timeout=180000
          npx remotion still src/jspark/index.ts JsparkShort out/Jspark-Short-Preview.png \
            --frame=90 --scale=0.5 --timeout=180000

      - uses: actions/upload-artifact@v4
        with:
          name: jspark-professional-short
          path: |
            out/Jspark-Academic-Comeback-Short.mp4
            out/Jspark-Short-Preview.png
            docs/jspark-short-edit-plan.md
          retention-days: 7
